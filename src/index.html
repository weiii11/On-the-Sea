<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8cb3bd"><title>On the Sea · 看海，听浪</title><meta name="description" content="一个可以看海、听浪的小小空间。陪你放空发呆，也陪你安静学习。"><link rel="stylesheet" href="./style.css"><script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/addons/"}}</script></head><body>
